<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <!-- World 2 · The Blend Beach -->
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky2)"/>
  <circle cx="84" cy="60" r="32" fill="#FDE68A"/>
  <circle cx="84" cy="60" r="42" fill="#FDE68A" opacity=".35"/>
  <ellipse cx="330" cy="66" rx="46" ry="14" fill="#FFFFFF" opacity=".9"/>
  <ellipse cx="368" cy="56" rx="28" ry="10" fill="#FFFFFF" opacity=".9"/>

  <!-- sea -->
  <rect x="0" y="130" width="480" height="70" fill="url(#sea2)"/>
  <path d="M0 136 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".6" stroke-linecap="round"/>
