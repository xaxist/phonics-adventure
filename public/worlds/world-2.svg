  <path d="M398 158 C388 132 368 126 352 132 C372 128 388 140 398 158 Z" fill="#16A34A"/>
  <path d="M398 158 C408 132 428 126 444 132 C424 128 408 140 398 158 Z" fill="#22C55E"/>
  <circle cx="394" cy="162" r="5" fill="#B45309"/>
  <circle cx="404" cy="164" r="5" fill="#B45309"/>

  <!-- beach ball -->
  <circle cx="86" cy="248" r="20" fill="#FFFFFF"/>
  <path d="M86 228 A20 20 0 0 1 86 268 A11 20 0 0 0 86 228 Z" fill="#EF4444"/>
  <path d="M86 228 A20 20 0 0 0 86 268 A11 20 0 0 1 86 228 Z" fill="#3B82F6"/>

