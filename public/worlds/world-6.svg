<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <!-- World 6 · R-Controlled River -->
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBF7D0"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky6)"/>
  <circle cx="80" cy="58" r="28" fill="#FDE68A"/>
  <circle cx="80" cy="58" r="38" fill="#FDE68A" opacity=".35"/>
  <ellipse cx="340" cy="56" rx="40" ry="12" fill="#FFFFFF" opacity=".85"/>
  <ellipse cx="376" cy="46" rx="24" ry="9" fill="#FFFFFF" opacity=".85"/>

  <!-- banks -->
  <path d="M0 300 L0 130 C120 120 180 160 240 190 C300 220 380 240 480 230 L480 300 Z" fill="#4ADE80"/>
  <path d="M480 300 L480 140 C380 140 300 180 240 210 C180 240 100 250 0 240 L0 300 Z" fill="#22C55E"/>

  <!-- winding river -->
  <path d="M240 120 C200 160 300 190 250 224 C210 252 130 250 100 300 L380 300 C360 240 420 210 380 180 C350 158 280 150 240 120 Z" fill="url(#river)"/>
  <path d="M232 150 C210 176 280 196 240 226" stroke="#FFFFFF" stroke-width="4" opacity=".5" fill="none" stroke-linecap="round"/>

  <!-- forest -->
  <g>
    <path d="M36 150 L52 110 L68 150 Z" fill="#15803D"/>
    <path d="M36 136 L52 100 L68 136 Z" fill="#16A34A"/>
