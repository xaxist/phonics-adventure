  </g>
  <g>
    <path d="M404 160 L420 122 L436 160 Z" fill="#15803D"/>
    <rect x="416" y="158" width="8" height="10" fill="#B45309"/>
  </g>
  <g>
    <path d="M60 250 L74 218 L88 250 Z" fill="#15803D"/>
    <rect x="72" y="248" width="8" height="9" fill="#B45309"/>
  </g>

  <!-- paper boat with 'ar' sail -->
  <g>
    <path d="M186 258 L254 258 L238 280 L202 280 Z" fill="#F97316"/>
    <path d="M222 258 L222 200 L258 254 Z" fill="#FFFFFF"/>
    <text x="228" y="244" font-family="Baloo 2, Arial Rounded MT Bold, Arial, sans-serif" font-size="22" font-weight="800" fill="#6D4AE0" transform="rotate(-4 228 244)">ar</text>
    <rect x="219" y="198" width="4" height="60" fill="#78350F"/>
