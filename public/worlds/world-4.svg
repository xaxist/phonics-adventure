<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <!-- World 4 · Magic E Mountain -->
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky4)"/>
  <circle cx="76" cy="64" r="30" fill="#FDE68A"/>
  <circle cx="76" cy="64" r="40" fill="#FDE68A" opacity=".35"/>
  <ellipse cx="300" cy="60" rx="40" ry="12" fill="#FFFFFF" opacity=".85"/>

  <!-- far peak -->
  <path d="M280 232 L360 100 L440 232 Z" fill="#A78BFA"/>
  <!-- main mountain -->
  <path d="M60 236 L200 76 L340 236 Z" fill="#8B5CF6"/>
  <path d="M164 116 L200 76 L236 116 C224 132 212 132 200 122 C188 132 176 132 164 116 Z" fill="#FFFFFF"/>
