  <rect x="198" y="26" width="4" height="52" fill="#78350F"/>
  <path d="M202 28 h44 l-10 12 10 12 h-44 z" fill="#F97316"/>
  <text x="212" y="50" font-family="Baloo 2, Arial Rounded MT Bold, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">e!</text>
  <!-- snow cards -->
  <rect x="112" y="182" width="34" height="24" rx="6" fill="#FFF7E8" transform="rotate(-8 112 182)"/>
  <rect x="252" y="188" width="34" height="24" rx="6" fill="#FFF7E8" transform="rotate(7 252 188)"/>
  <!-- pines -->
  <g>
    <path d="M376 236 L392 196 L408 236 Z" fill="#15803D"/>
    <path d="M376 220 L392 184 L408 220 Z" fill="#16A34A"/>
    <rect x="388" y="234" width="8" height="12" fill="#B45309"/>
  </g>
  <g>
    <path d="M56 240 L70 206 L84 240 Z" fill="#16A34A"/>
    <rect x="68" y="238" width="8" height="10" fill="#B45309"/>
  </g>
  <rect x="0" y="232" width="480" height="68" fill="#DDD6FE"/>
